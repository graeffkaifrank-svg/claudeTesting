<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    h1 { font-size: 2.5rem; letter-spacing: 4px; color: #e94560; }

    #status {
      font-size: 1.2rem;
      color: #a8dadc;
      height: 1.5rem;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      font-size: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) { background: #0f3460; transform: scale(1.05); }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win { background: #0f3460; outline: 3px solid #e94560; }

    #reset {
      padding: 10px 32px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #reset:hover { background: #c73652; }

    #scores {
      display: flex;
      gap: 32px;
      font-size: 1rem;
      color: #ccc;
    }

    #scores span { font-weight: bold; color: #fff; }
  </style>
</head>
<body>

<h1>TIC TAC TOE</h1>

<div id="scores">
  X: <span id="score-x">0</span> &nbsp;|&nbsp; Unentschieden: <span id="score-d">0</span> &nbsp;|&nbsp; O: <span id="score-o">0</span>
</div>

<div id="status">Spieler X ist dran</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<button id="reset">Neu starten</button>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, over;
  const scores = { X: 0, O: 0, D: 0 };

  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');
  const scoreX = document.getElementById('score-x');
  const scoreO = document.getElementById('score-o');
  const scoreD = document.getElementById('score-d');

  function init() {
    board = Array(9).fill('');
    current = 'X';
    over = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = 'Spieler X ist dran';
  }

  function checkWin() {
    return WINS.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (over || board[i]) return;

      board[i] = current;
      cell.textContent = current === 'X' ? '✕' : '○';
      cell.classList.add(current.toLowerCase(), 'taken');

      const win = checkWin();
      if (win) {
        win.forEach(idx => cells[idx].classList.add('win'));
        status.textContent = `Spieler ${current} gewinnt! 🎉`;
        scores[current]++;
        scoreX.textContent = scores.X;
        scoreO.textContent = scores.O;
        over = true;
      } else if (board.every(v => v)) {
        status.textContent = 'Unentschieden!';
        scores.D++;
        scoreD.textContent = scores.D;
        over = true;
      } else {
        current = current === 'X' ? 'O' : 'X';
        status.textContent = `Spieler ${current} ist dran`;
      }
    });
  });

  document.getElementById('reset').addEventListener('click', init);

  init();
</script>

</body>
</html>
