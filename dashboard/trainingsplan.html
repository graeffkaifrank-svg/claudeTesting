<style>

:root{

  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151515; --surface:#151515; --sunk:#222221; --ink:#ececea; --muted:#9c9c97; --line:#2f2f2d; --rule:#ececea;
  --ac:#d4d4d0; --py:#6b6b67; --pl:#d4d4d0;
  --good:#8cc63f; --bad:#f05a4f; --mid:#f2b63c; --hl:#ff8c2a; --info:#6ea6e8; --warn:#ff8c2a;
  --good-soft:#2a3a17; --accent:#ececea; --accent-ink:#151515; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151515; --surface:#151515; --sunk:#222221; --ink:#ececea; --muted:#9c9c97; --line:#2f2f2d; --rule:#ececea;
  --ac:#d4d4d0; --py:#6b6b67; --pl:#d4d4d0;
  --good:#8cc63f; --bad:#f05a4f; --mid:#f2b63c; --hl:#ff8c2a; --info:#6ea6e8; --warn:#ff8c2a;
  --good-soft:#2a3a17; --accent:#ececea; --accent-ink:#151515; color-scheme:dark}
*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return [t.getUTCFullYear(), Math.ceil(((t-y0)/864e5+1)/7)]; };

const S = { mcp:null, sample:null, dl:null, D:{}, H:{}, loaded:false, view:"woche", week:monday(new Date()), calWeeks:8, phaseSel:null, busy:new Set(), drafts:[], openHz:new Set(), fresh:null };

  S.H[name] = head;
  const out = [];
  for (let i = 1; i < rows.length; i++){
    const r = rows[i]; if (!r || !r.length) continue;
    const o = { _row: i+1 }; head.forEach((h, j) => o[h] = r[j] ?? "");

    const v = payload(r)?.values || []; const i = v.findIndex(x => String(x?.[0]||"").trim() === key);

async function guarded(label, fn, ids){

/* ---------- derived ---------- */
const typInfo = t => (S.D.Typen||[]).find(x => x.typ === t) || { kategorie:"Sonstiges", zeit_relevant:"nein", farbe:"#9AA39F" };

const phases = () => [...(S.D.Phasen||[])].sort((a,b) => a.start.localeCompare(b.start));
const activePhase = () => phases().find(p => p.status === "aktiv") || phases().at(-1);
const phaseFor = mon => phases().find(p => p.start <= addDaysIso(mon,6) && (!p.ende || p.ende >= mon) && p.start <= mon) || phases().find(p => p.start <= addDaysIso(mon,6) && (!p.ende || p.ende >= mon));

  return hz.map(h => ({ ...h, subs: (S.D.Ziele||[]).filter(z => z.hauptziel_id === h.id).sort((a,b) => num(a.reihenfolge)-num(b.reihenfolge)) }));

const unitsIn = (from, to) => (S.D.Einheiten||[]).filter(u => u.status !== "geloescht" && u.datum >= from && u.datum <= to);

function zielMin(z){

}

let evalCache = new Map();
function evalWeek(mon){

  const hz = ph ? goalsOf(ph.id).map(h => {
    const subs = h.subs.map(z => {
      let ist = 0, plan = 0; const ziel = Math.max(1, num(z.zielwert));

        else if (u.status === "geplant") plan += z.messgroesse === "minuten" ? planMin(u) : 1; }

    if (name){ const h = e.hz.find(x => x.h.name === name); if (!h) continue; if (h.ok) n++; else break; }

function phaseStats(ph){
  const cur = iso(monday(new Date()));
  const ws = allWeeks().filter(w => phaseFor(w)?.id === ph.id);
  const names = goalsOf(ph.id).map(h => h.name);
  const stat = (pred) => { let done = 0, eval_ = 0, best = 0, run = 0;
    for (const w of ws){ if (w >= cur) continue; const e = evalWeek(w); if (e.exc) continue; const r = pred(e); if (r == null) continue; eval_++; if (r){ done++; run++; best = Math.max(best, run); } else run = 0; }

const unitById = id => (S.D.Einheiten||[]).find(u => u.id === id);
async function createUnit(d){
  const v = d.vorlage_id ? vorlage(d.vorlage_id) : null;
  const u = { id: rid("E-"), datum: d.datum, uhrzeit: d.uhrzeit || "", titel: d.titel || v?.name || d.typ, typ: d.typ || v?.typ || "Sonstiges", vorlage_id: d.vorlage_id || "",
    status: d.status || (d.datum < today() ? "erledigt" : "geplant"), dauer_geplant_min: d.dauer || num(v?.dauer_standard_min) || "", dauer_ist_min: d.dauer_ist || "", gefuehl: "", kommentar: d.kommentar || "",
    quelle: d.quelle || "dashboard", kalender_event_id: "", garmin_activity_id: "", erstellt_am: nowIso(), geaendert_am: nowIso() };
  S.D.Einheiten.push(u);
  const ok = await guarded("Anlegen fehlgeschlagen", () => appendRow("Einheiten", u), [u.id]);
  if (ok){ toast("„" + u.titel + "“ für " + dayLabel(u.datum) + " gespeichert"); if (u.status === "geplant") calSync(u, "create"); }

async function saveUnit(u, calAction){
  u.geaendert_am = nowIso();

  if (ok && calAction) calSync(u, calAction);
  return ok;
}
async function toggleDone(u){
  if (u.status === "erledigt"){ u.status = "geplant"; u.dauer_ist_min = ""; return saveUnit(u, "update"); }
  if (typInfo(u.typ).zeit_relevant === "ja" || u.typ === "Lauf-Benchmark") return openCheckoff(u);
  u.status = "erledigt"; if (!u.dauer_ist_min) u.dauer_ist_min = u.dauer_geplant_min || "";
  return saveUnit(u, "update");
}
async function setException(mon, art){
  const wk = weekKey(pd(mon)); const ex = (S.D.Wochen||[]).find(w => w.woche === wk);
  if (!art && ex && String(ex.notiz||"").trim()){ ex.art = ""; await guarded("Speichern fehlgeschlagen", () => updateRow("Wochen", ex)); }
  else if (!art && ex){ S.D.Wochen = S.D.Wochen.filter(w => w !== ex); await guarded("Speichern fehlgeschlagen", () => clearRow("Wochen", wk)); }
  else if (art && ex){ ex.art = art; await guarded("Speichern fehlgeschlagen", () => updateRow("Wochen", ex)); }
  else if (art){ const o = { woche: wk, art, notiz: "" }; S.D.Wochen.push(o); await guarded("Speichern fehlgeschlagen", () => appendRow("Wochen", o)); }
  toast(art ? "Woche als " + art + " markiert – zählt nicht für Streaks" : "Ausnahme entfernt");
}

async function setWeekTitle(mon, text){
  const wk = weekKey(pd(mon)); const ex = (S.D.Wochen||[]).find(w => w.woche === wk); text = text.trim();
  if (ex && !text && !String(ex.art||"").trim()){ S.D.Wochen = S.D.Wochen.filter(w => w !== ex); await guarded("Speichern fehlgeschlagen", () => clearRow("Wochen", wk)); }

/* ---------- calendar ---------- */
const calOn = () => cfg("kalender_sync") === "ja" && S.mcp;
function calTimes(u){
  if (u.uhrzeit){ const [hh, mm] = u.uhrzeit.split(":").map(Number); const st = pd(u.datum); st.setHours(hh, mm||0); const en = new Date(st.getTime() + (planMin(u)||60)*6e4);
    const f = d => iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00"; return { startTime: f(st), endTime: f(en), allDay: false }; }
  return { startTime: u.datum + "T00:00:00", endTime: addDaysIso(u.datum, 1) + "T00:00:00", allDay: true };
}
function calDesc(u){ const v = vorlage(u.vorlage_id) || vorlageForTyp(u.typ); const url = cfg("dashboard_url");
  return [u.typ + (planMin(u) ? " · " + planMin(u) + " min" : ""), v?.kurzbeschreibung, v?.anleitung, url ? "Dashboard: " + url : "", "Sheet: " + SHEET_URL].filter(Boolean).join("\n\n"); }
async function calSync(u, action){
  if (!calOn()) return;
  const cal = cfg("kalender_id") || undefined;
  try {
    if (action === "create" || (action === "update" && !u.kalender_event_id && u.status === "geplant")){
      const r = await S.mcp.callTool(GC, "create_event", Object.assign({ calendarId: cal, summary: "Training: " + (u.titel || u.typ), description: calDesc(u), availability: "AVAILABILITY_FREE" }, calTimes(u)));
      const p = payload(r) || {}; const id = p.id || p.eventId || p.event?.id || p.event?.eventId;
      if (id){ u.kalender_event_id = id; await updateRow("Einheiten", u); }
      return;
    }
    if (!u.kalender_event_id) return;
    if (u.status === "ausgelassen" || u.status === "geloescht"){
      await S.mcp.callTool(GC, "delete_event", { calendarId: cal, eventId: u.kalender_event_id, notificationLevel: "NONE" });
      u.kalender_event_id = ""; await updateRow("Einheiten", u); return;
    }
    await S.mcp.callTool(GC, "update_event", Object.assign({ calendarId: cal, eventId: u.kalender_event_id, notificationLevel: "NONE",
      summary: (u.status === "erledigt" ? "✓ " : "Training: ") + (u.titel || u.typ), description: calDesc(u) }, calTimes(u)));
  } catch (e){ toast("Kalender: " + errText(Object.assign({ server: GC }, e))); }
}

/* ---------- drag & drop ---------- */
let drag = null;
document.addEventListener("pointerdown", ev => {
  const h = ev.target.closest("[data-drag]"); if (!h || ev.button > 0) return;
  ev.preventDefault(); const u = unitById(h.dataset.drag);
  drag = { id: h.dataset.drag, x: ev.clientX, y: ev.clientY, moved: false, ghost: null, over: null, pid: ev.pointerId, label: u?.titel || "Einheit" };
  try { h.setPointerCapture(ev.pointerId); } catch {}
});
document.addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(ev.clientX-drag.x, ev.clientY-drag.y) < 6) return;
  if (!drag.moved){ drag.moved = true; const g = document.createElement("div"); g.className = "dragghost"; g.textContent = drag.label; document.body.appendChild(g); drag.ghost = g; }
  drag.ghost.style.left = ev.clientX + "px"; drag.ghost.style.top = ev.clientY + "px";
  const day = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("[data-day]");
  if (day !== drag.over){ drag.over?.classList.remove("over"); day?.classList.add("over"); drag.over = day; }
  if (ev.clientY < 60) window.scrollBy(0, -12); else if (ev.clientY > innerHeight - 60) window.scrollBy(0, 12);
});
function endDrag(ev, cancel){
  if (!drag || ev.pointerId !== drag.pid) return; const d = drag; drag = null;
  d.ghost?.remove(); d.over?.classList.remove("over");
  const u = unitById(d.id); if (!u || cancel) return;
  if (!d.moved) return openUnit(u);
  if (!d.over || d.over.dataset.day === u.datum) return;
  u.datum = d.over.dataset.day; saveUnit(u, "update").then(ok => ok && toast("Auf " + dayLabel(u.datum) + " verschoben"));
}
document.addEventListener("pointerup", ev => endDrag(ev, false));
document.addEventListener("pointercancel", ev => endDrag(ev, true));
document.addEventListener("click", ev => {
  const c = ev.target.closest("[data-chk]"); if (c){ const u = unitById(c.dataset.chk); if (u && !S.busy.has(u.id)) toggleDone(u); return; }
  const o = ev.target.closest("[data-open]"); if (o){ const u = unitById(o.dataset.open); if (u) openUnit(u); return; }
  const a = ev.target.closest("[data-add]"); if (a) openAdd(a.dataset.add);
});

/* ---------- Wochenvorschlag ---------- */
async function suggestWeek(mon){
  if (!S.sample){ toast("Vorschläge gehen nur in claude.ai mit freigegebener KI-Funktion."); return; }
  const e = evalWeek(mon); if (!e.ph){ toast("Keine Phase für diese Woche."); return; }
  const btn = $("suggest"); btn.disabled = true; btn.textContent = "Claude plant …";
  try {
    let busy = "";

    const existing = e.us.map(u => "- " + u.datum + " " + u.typ + " (" + u.status + ")").join("\n") || "keine";
    const vs = (S.D.Vorlagen||[]).filter(v => v.aktiv !== "nein").map(v => "- " + v.id + ": " + v.name + " (Typ " + v.typ + ", Kategorie " + typInfo(v.typ).kategorie + ", " + v.dauer_standard_min + " min)").join("\n");

      + "Woche: " + mon + " (Montag) bis " + addDaysIso(mon,6) + ". Heute ist " + today() + "; plane nur Tage ab heute.\n"
      + "Phase: " + e.ph.name + " – " + e.ph.fokus + "\nCoaching-Notizen: " + e.ph.coaching_notizen + "\n\n"

      + "Termine im Kalender (Konflikte vermeiden):\n" + (busy || "keine bekannt") + "\n\nLetzte 4 Wochen:\n" + prev + "\n\nVorlagen:\n" + vs + "\n\n"
      + "Regeln: keine zwei harten Kraft-Einheiten (Fingerkraft Max, Bouldern Max, Beintraining) an aufeinanderfolgenden Tagen; kein Intervall am Tag nach Fingerkraft Max oder Beintraining; nach Kraft nur GA1/Recovery; max. 2 Einheiten pro Tag; Fingerkraft Max kann mit Eisgeräte am selben Tag kombiniert werden. Plane nur, was zur Zielerfüllung fehlt, plus höchstens einen Benchmark.\n\n"
      + "Format: {\"einheiten\":[{\"datum\":\"YYYY-MM-DD\",\"vorlage_id\":\"V-…\",\"dauer\":Minuten,\"begruendung\":\"ein kurzer Satz auf Deutsch\"}]}";
    const out = await S.sample.json(prompt, { modelTier: "default" });
    const arr = Array.isArray(out) ? out : (out?.einheiten || []);
    S.drafts = arr.filter(x => x && x.datum >= mon && x.datum <= addDaysIso(mon,6) && vorlage(x.vorlage_id)).map(x => { const v = vorlage(x.vorlage_id); return { datum: x.datum, vorlage_id: v.id, typ: v.typ, titel: v.name, dauer: Number(x.dauer) || num(v.dauer_standard_min), begruendung: x.begruendung, quelle: "vorschlag", status: "geplant" }; });

  } catch (err){ toast(err?.code === "not_granted" ? "KI-Vorschläge sind für diese Seite nicht freigegeben." : "Vorschlag fehlgeschlagen" + (err?.code ? " (" + err.code + ")" : "") + "."); }

/* IBCS column chart: AC solid, PL outlined, value labels, ΔPL green/red, no gridlines */
function ibcsColumns(data, o){
  o = Object.assign({ fmt: v => Math.round(v), sub: null, lowerBetter: false, deltaFmt: null, h: 210 }, o || {});
  const W = Math.max(320, data.length * 52), H = o.h, top = 34, bot = 26 + (o.sub ? 14 : 0) + (data.some(d => d.delta != null) ? 16 : 0);
  const max = Math.max(1, ...data.map(d => Math.max(d.ac || 0, d.pl || 0, d.tl || 0)));
  const bw = W / data.length, y = v => top + (H - top - bot) * (1 - v / max), base = H - bot;
  let s = "<svg class='chart' viewBox='0 0 " + W + " " + H + "' role='img' aria-label='" + esc(o.aria || "Säulendiagramm") + "' style='max-height:" + (H+20) + "px;min-width:" + Math.round(W*0.8) + "px'>";
  data.forEach((d, i) => {
    const cx = i * bw + bw / 2, w = Math.min(34, bw * 0.62);
    if (d.pl != null) s += "<rect x='" + (cx - w/2 + w*0.22) + "' y='" + y(d.pl) + "' width='" + w + "' height='" + Math.max(0, base - y(d.pl)) + "' fill='none' stroke='var(--pl)' stroke-width='1.2'><title>Soll " + esc(o.fmt(d.pl)) + "</title></rect>";
    if (d.ac != null && d.ac2 != null){ s += "<rect x='" + (cx - w/2) + "' y='" + y(d.ac) + "' width='" + w + "' height='" + Math.max(0, base - y(d.ac)) + "' fill='var(--py)'><title>" + esc(d.tip || o.fmt(d.ac)) + "</title></rect>"
      + "<rect x='" + (cx - w/2) + "' y='" + y(d.ac2) + "' width='" + w + "' height='" + Math.max(0, base - y(d.ac2)) + "' fill='var(--ac)'><title>" + esc(d.tip || o.fmt(d.ac2)) + "</title></rect>"; }
    else if (d.ac != null) s += "<rect x='" + (cx - w/2) + "' y='" + y(d.ac) + "' width='" + w + "' height='" + Math.max(0, base - y(d.ac)) + "' fill='var(--ac)'><title>" + esc(d.tip || o.fmt(d.ac)) + "</title></rect>";
    if (d.ac != null) s += "<text x='" + cx + "' y='" + (Math.min(y(d.ac), d.pl != null ? y(d.pl) : 1e9) - 5) + "' text-anchor='middle' font-size='11' font-weight='600' fill='var(--ink)'>" + esc(o.fmt(d.ac)) + "</text>";
    if (d.tl){ s += "<line x1='" + (i*bw + 1) + "' x2='" + ((i+1)*bw - 1) + "' y1='" + y(d.tl) + "' y2='" + y(d.tl) + "' stroke='var(--ink)' stroke-width='1.2' stroke-dasharray='4 3'><title>Soll " + esc(o.fmt(d.tl)) + "</title></line>";
      const nx = data[i+1]; if (!nx || nx.tl !== d.tl) s += "<text x='" + ((i+1)*bw - 2) + "' y='" + (y(d.tl) - 4) + "' text-anchor='end' font-size='10' fill='var(--muted)'>Soll " + esc(o.fmt(d.tl)) + "</text>"; }
    s += "<line x1='" + (i*bw + 2) + "' x2='" + ((i+1)*bw - 2) + "' y1='" + base + "' y2='" + base + "' stroke='var(--ink)' stroke-width='1'/>";
    s += "<text x='" + cx + "' y='" + (base + 14) + "' text-anchor='middle' font-size='10' fill='var(--muted)'>" + esc(d.label) + "</text>";
    let yy = base + 14;
    if (o.sub){ yy += 13; s += "<text x='" + cx + "' y='" + yy + "' text-anchor='middle' font-size='10' fill='var(--ink)'>" + esc(o.sub(d) || "") + "</text>"; }
    if (d.delta != null){ yy += 13; const good = o.lowerBetter ? d.delta < 0 : d.delta > 0; const col = d.delta === 0 ? "var(--muted)" : good ? "var(--good)" : "var(--bad)";
      s += "<text x='" + cx + "' y='" + yy + "' text-anchor='middle' font-size='10' font-weight='600' fill='" + col + "'>" + esc((o.deltaFmt || (v => (v > 0 ? "+" : "") + o.fmt(v)))(d.delta)) + "</text>"; }
  });
  return s + "</svg>";
}
const hm = m => { m = Math.round(m); return Math.floor(m/60) + ":" + pad(m%60); };
function minutesChart(ws){
  const cur = iso(monday(new Date()));
  const data = ws.map(w => { const e = evalWeek(w); const c = {}; let t = 0; e.us.filter(u => u.status === "erledigt").forEach(u => { const k = typInfo(u.typ).kategorie; c[k] = (c[k]||0) + istMin(u); t += istMin(u); });
    const tl = Math.round(phaseTargetMin(e.ph)) || null;
    return { label: "KW" + isoWeek(pd(w))[1] + (w === cur ? "*" : ""), ac: t, tl, tip: Object.entries(c).map(([k,m]) => k + " " + hm(m)).join(" · ") }; });
  data.forEach((d, i) => { if (i > 0 && !d.label.endsWith("*")) d.delta = d.ac - data[i-1].ac; });
  return ibcsColumns(data, { fmt: hm, deltaFmt: v => (v > 0 ? "+" : "−") + hm(Math.abs(v)), aria: "Trainingszeit pro Woche" });
}

  v.querySelectorAll("[data-bnew]").forEach(btn => btn.onclick = () => { const b = bs.find(x => x.id === btn.dataset.bnew);
    openSheet("<h2>Ergebnis eintragen</h2><div class='field'><label for='bDate'>Datum</label><input type='date' id='bDate' value='" + today() + "'></div>" + benchFieldsHTML(b) + "<div class='field'><label for='bKom'>Kommentar</label><textarea id='bKom'></textarea></div><div class='spread'><button class='btn ghost' id='cx'>Abbrechen</button><button class='btn primary' id='bOk'>Speichern</button></div>", () => {
      $("cx").onclick = closeSheet; $("bOk").onclick = async () => { const res = readBench(b); if (!res){ toast("Bitte mindestens einen Messwert eintragen."); return; } const d = $("bDate").value || today(), k = $("bKom").value.trim(); closeSheet(); await saveBenchResult(b, res, { datum: d, kommentar: k }); }; }); });
  v.querySelectorAll("[data-bplan]").forEach(btn => btn.onclick = () => { const b = bs.find(x => x.id === btn.dataset.bplan); openAdd(today(), b.vorlage_id); });
  if ($("blogNew")) $("blogNew").onclick = () => writePost(posts[0]);
}
async function writePost(last){
  const since = last ? last.datum : addDaysIso(today(), -14);
  const runs = (S.D.Einheiten||[]).filter(u => u.status === "erledigt" && isRun(u) && u.datum > since).sort((a,b) => a.datum.localeCompare(b.datum));
  const all = (S.D.Einheiten||[]).filter(u => u.status === "erledigt" && u.datum > since);
  if (!runs.length){ toast("Seit dem letzten Beitrag gab es keine Läufe."); return; }
  const bm = (S.D.Benchmark_Ergebnisse||[]).slice(-4).map(r => r.datum + ": " + fmtSec(num(r.hauptwert)) + " " + (r.kommentar||"")).join("\n");
  const lz = goalsOf(activePhase()?.id).flatMap(x => x.subs).filter(z => /lauf|intervall|ga1/i.test(z.filter_werte + z.bezeichnung)).map(z => z.bezeichnung + " " + z.zielwert + (z.messgroesse === "minuten" ? " min" : "×") + "/Woche").join(", ");
  openSheet("<h2>Neuer Blog-Beitrag</h2><p class='small muted'>" + runs.length + " Läufe seit " + shortDate(since) + ". Claude schreibt eine kurze Analyse mit Tipp; du kannst sie vor dem Speichern anpassen.</p><div class='field'><label for='pT'>Titel</label><input id='pT' placeholder='wird vorgeschlagen …'></div><div class='field'><label for='pX'>Text</label><textarea id='pX' style='min-height:260px'>Claude schreibt …</textarea></div><div class='spread'><button class='btn ghost' id='cx'>Abbrechen</button><button class='btn primary' id='pOk' disabled>Beitrag speichern</button></div>", () => { $("cx").onclick = closeSheet; });
  try {
    const prompt = "Du bist Kais Lauf-Coach und schreibst einen kurzen Blog-Beitrag (Deutsch, du-Form, sachlich, keine Floskeln, keine Motivationssprüche) über seine letzten Läufe. Struktur: 1 Satz Überblick; 'Was auffällt' (2–4 Stichpunkte mit konkreten Zahlen: Dauer, Pace, Puls, Häufigkeit GA1 vs. Intervall, Muster in seinen Kommentaren); 'Tipp' (genau ein konkreter, umsetzbarer Tipp für die nächsten 1–2 Wochen, passend zu den Zielen). Maximal 160 Wörter. Antworte als JSON {\"titel\":\"kurzer Titel\",\"text\":\"Markdown mit '- ' Aufzählungen\"}.\n\n"
      + "Ziele der Phase " + (activePhase()?.name||"") + ": " + lz + ". Fokus: " + (activePhase()?.fokus||"") + "\nLaktatschwellen: " + cfg("laktat_schwelle1") + "; " + cfg("laktat_schwelle2") + "\nReferenzläufe:\n" + bm + "\n\nLäufe seit " + since + ":\n"
      + runs.map(u => "- " + u.datum + " " + u.typ + " '" + u.titel + "': " + hm(istMin(u)) + (num(u.distanz_km) ? ", " + u.distanz_km + " km, Pace " + fmtPace(paceOf(u)) : "") + (num(u.puls_avg) ? ", Ø " + u.puls_avg + " bpm" : "") + (u.kommentar ? " – " + u.kommentar : "")).join("\n")
      + "\n\nAndere Einheiten im Zeitraum: " + all.filter(u => !isRun(u)).map(u => u.datum + " " + u.typ).join(", ");
    const out = await S.sample.json(prompt, { modelTier: "default" });
    if ($("pT")){ $("pT").value = out?.titel || "Lauf-Update"; $("pX").value = out?.text || ""; $("pOk").disabled = false;
      $("pOk").onclick = async () => { const p = { id: rid("J-"), datum: today(), titel: $("pT").value.trim() || "Lauf-Update", text: $("pX").value.trim(), quelle: "dashboard" }; closeSheet();
        S.D.Journal = S.D.Journal || []; S.D.Journal.push(p); if (await guarded("Speichern fehlgeschlagen", () => appendRow("Journal", p))) toast("Beitrag gespeichert"); }; }
  } catch (e){ if ($("pX")) $("pX").value = "Analyse fehlgeschlagen" + (e?.code ? " (" + e.code + ")" : "") + "."; }
}

/* ---------- Ziele & Phasen ---------- */
function renderZiele(v){
  const ps = phases(); const ph = ps.find(p => p.id === S.phaseSel) || activePhase();
  if (!ph){ v.innerHTML = "<div class='panel'>Keine Phase vorhanden.</div>"; return; }
  const hz = goalsOf(ph.id);
  const typs = (S.D.Typen||[]).map(t => t.typ), cats = [...new Set((S.D.Typen||[]).map(t => t.kategorie))];
  let h = "<section class='spread'><select class='btn' id='zPh'>" + ps.map(p => "<option value='" + esc(p.id) + "'" + (p.id === ph.id ? " selected" : "") + ">" + esc(p.name) + (p.status === "aktiv" ? " (aktiv)" : "") + "</option>").join("") + "</select><button class='btn primary' id='newPh'>Neue Phase nach Coaching</button></section>";
  h += "<div class='panel'><div class='g2'><div class='field'><label for='pName'>Name</label><input id='pName' value='" + esc(ph.name) + "'></div><div class='g2'><div class='field'><label for='pStart'>Start</label><input type='date' id='pStart' value='" + esc(ph.start) + "'></div><div class='field'><label for='pEnde'>Ende</label><input type='date' id='pEnde' value='" + esc(ph.ende) + "'></div></div></div>"
    + "<div class='field'><label for='pFokus'>Fokus</label><input id='pFokus' value='" + esc(ph.fokus) + "'></div><div class='field'><label for='pNot'>Coaching-Notizen</label><textarea id='pNot'>" + esc(ph.coaching_notizen) + "</textarea></div>"
    + (ph.coaching_link ? "<a href='" + esc(ph.coaching_link) + "' target='_blank' rel='noopener'>Coaching-Notizen in Notion ↗</a>" : "") + "</div>";
  h += hz.map(x => "<div class='panel hz' style='--hc:" + esc(x.farbe) + "' data-hz='" + esc(x.id) + "'><div class='spread'><input class='btn' style='font-family:var(--display);font-size:18px;font-weight:600' data-hzname value='" + esc(x.name) + "' aria-label='Name Hauptziel'><button class='btn ghost danger' data-hzdel>Hauptziel entfernen</button></div>"
    + x.subs.map(z => zRowHTML(z, typs, cats)).join("") + "<button class='btn' data-zadd>+ Subziel</button></div>").join("");
  h += "<div class='row'><button class='btn' id='hzAdd'>+ Hauptziel</button><span style='flex:1'></span><button class='btn primary' id='zSave'>Phase & Ziele speichern</button></div>"
    + "<p class='small muted'>Eine Einheit zählt für ein Subziel, wenn ihr Typ (oder die Kategorie ihres Typs) in der Liste steht. Ein Hauptziel ist erfüllt, wenn alle Subziele erfüllt sind. Gesamt ist erfüllt, wenn alle Hauptziele erfüllt sind.</p>";
  v.innerHTML = h;
  const wireRows = () => v.querySelectorAll("[data-zdel]").forEach(b => b.onclick = () => b.closest(".zrow").remove());
  wireRows();
  $("zPh").onchange = ev => { S.phaseSel = ev.target.value; render(); };
  v.querySelectorAll("[data-zadd]").forEach(b => b.onclick = () => { b.insertAdjacentHTML("beforebegin", zRowHTML({ id:"", bezeichnung:"", messgroesse:"anzahl", zielwert:1, filter_ebene:"typ", filter_werte:"" }, typs, cats)); wireRows(); });
  v.querySelectorAll("[data-hzdel]").forEach(b => b.onclick = () => { if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Wirklich entfernen?"; return; } b.closest("[data-hz]").remove(); });
  $("hzAdd").onclick = () => {
    $("hzAdd").parentElement.insertAdjacentHTML("beforebegin", "<div class='panel hz' style='--hc:#5E7A6E' data-hz=''><div class='spread'><input class='btn' style='font-family:var(--display);font-size:18px;font-weight:600' data-hzname placeholder='z.B. Beine' aria-label='Name Hauptziel'><button class='btn ghost danger' data-hzdel>Entfernen</button></div><button class='btn' data-zadd>+ Subziel</button></div>");
    const box = $("hzAdd").parentElement.previousElementSibling;
    box.querySelector("[data-zadd]").onclick = ev => { ev.target.insertAdjacentHTML("beforebegin", zRowHTML({ id:"", bezeichnung:"", messgroesse:"anzahl", zielwert:1, filter_ebene:"typ", filter_werte:"" }, typs, cats)); wireRows(); };
    box.querySelector("[data-hzdel]").onclick = () => box.remove();
  };
  v.addEventListener("change", ev => { const sel = ev.target.closest("[data-f='filter_ebene']"); if (sel) sel.closest(".zrow").querySelector("[data-f='filter_werte']").setAttribute("list", sel.value === "kategorie" ? "dl_k" : "dl_t"); });
  $("newPh").onclick = () => openNewPhase(ph);
  $("zSave").onclick = () => saveGoals(ph, v);
}
function zRowHTML(z, typs, cats){
  const opts = (z.filter_ebene === "kategorie" ? cats : typs);
  return "<div class='zrow' data-z='" + esc(z.id) + "'><div class='field'><label>Subziel</label><input data-f='bezeichnung' value='" + esc(z.bezeichnung) + "'></div>"
    + "<div class='field'><label>Messen</label><select data-f='messgroesse'><option value='anzahl'" + (z.messgroesse !== "minuten" ? " selected" : "") + ">Anzahl ×</option><option value='minuten'" + (z.messgroesse === "minuten" ? " selected" : "") + ">Minuten</option></select></div>"
    + "<div class='field'><label>Pro Woche</label><input data-f='zielwert' type='number' min='1' inputmode='numeric' value='" + esc(z.zielwert) + "'></div>"
    + "<div class='field'><label>Zählt: " + "<select data-f='filter_ebene' style='min-height:0;padding:0 4px;width:auto;display:inline-block'><option value='typ'" + (z.filter_ebene !== "kategorie" ? " selected" : "") + ">Typen</option><option value='kategorie'" + (z.filter_ebene === "kategorie" ? " selected" : "") + ">Kategorien</option></select></label><input data-f='filter_werte' value='" + esc(z.filter_werte) + "' list='dl_" + (z.filter_ebene === "kategorie" ? "k" : "t") + "' placeholder='kommagetrennt'></div>"
    + "<button class='btn ghost danger' data-zdel aria-label='Subziel entfernen'>✕</button>"
    + "<datalist id='dl_t'>" + typs.map(t => "<option value='" + esc(t) + "'>").join("") + "</datalist><datalist id='dl_k'>" + cats.map(t => "<option value='" + esc(t) + "'>").join("") + "</datalist></div>";
}
async function saveGoals(ph, v){
  const btn = $("zSave"); btn.disabled = true; btn.textContent = "Speichere …";
  const ok = await guarded("Speichern fehlgeschlagen", async () => {
    Object.assign(ph, { name: $("pName").value.trim() || ph.name, start: $("pStart").value || ph.start, ende: $("pEnde").value, fokus: $("pFokus").value.trim(), coaching_notizen: $("pNot").value.trim() });
    await updateRow("Phasen", ph);
    const keepHz = new Set(), keepZ = new Set();
    let hi = 0;
    for (const box of v.querySelectorAll("[data-hz]")){
      hi++; const name = box.querySelector("[data-hzname]").value.trim(); if (!name) continue;
      let h = (S.D.Hauptziele||[]).find(x => x.id === box.dataset.hz);
      if (h){ h.name = name; h.reihenfolge = hi; await updateRow("Hauptziele", h); }
      else { h = { id: rid("H-",6), phase_id: ph.id, name, farbe: ({Klettern:"#C24A3A", Laufen:"#3B78C4", Beine:"#5E7A6E"})[name] || "#7A6FA8", reihenfolge: hi }; S.D.Hauptziele.push(h); await appendRow("Hauptziele", h); }
      keepHz.add(h.id); let zi = 0;
      for (const row of box.querySelectorAll(".zrow")){
        zi++; const f = k => row.querySelector("[data-f='" + k + "']").value.trim();
        if (!f("bezeichnung")) continue;
        const data = { phase_id: ph.id, hauptziel_id: h.id, bezeichnung: f("bezeichnung"), messgroesse: f("messgroesse"), zielwert: Math.max(1, num(f("zielwert"))), filter_ebene: f("filter_ebene"), filter_werte: list(f("filter_werte")).join(", "), reihenfolge: zi };
        let z = (S.D.Ziele||[]).find(x => x.id === row.dataset.z);
        if (z){ Object.assign(z, data); await updateRow("Ziele", z); } else { z = Object.assign({ id: rid("Z-",6) }, data); S.D.Ziele.push(z); await appendRow("Ziele", z); }
        keepZ.add(z.id);
      }
    }
    for (const z of (S.D.Ziele||[]).filter(z => z.phase_id === ph.id && !keepZ.has(z.id))){ await clearRow("Ziele", z.id); }
    for (const h of (S.D.Hauptziele||[]).filter(h => h.phase_id === ph.id && !keepHz.has(h.id))){ await clearRow("Hauptziele", h.id); }
    S.D.Ziele = S.D.Ziele.filter(z => z.phase_id !== ph.id || keepZ.has(z.id)); S.D.Hauptziele = S.D.Hauptziele.filter(h => h.phase_id !== ph.id || keepHz.has(h.id));
  });
  if (ok) toast("Phase und Ziele gespeichert");
}
function openNewPhase(prev){
  openSheet("<h2>Neue Phase starten</h2><p class='small muted'>Die Ziele von „" + esc(prev.name) + "“ werden übernommen und lassen sich danach unter „Ziele“ anpassen. Die aktuelle Phase wird am Vortag abgeschlossen.</p>"
    + "<div class='g2'><div class='field'><label for='nName'>Name</label><input id='nName' placeholder='z.B. Frühling 2027'></div><div class='field'><label for='nStart'>Start (Coaching-Tag)</label><input type='date' id='nStart' value='" + today() + "'></div></div>"
    + "<div class='field'><label for='nFokus'>Fokus</label><input id='nFokus'></div><div class='field'><label for='nNot'>Coaching-Notizen</label><textarea id='nNot'></textarea></div><div class='field'><label for='nLink'>Link zu den Notizen (optional)</label><input id='nLink' inputmode='url'></div>"
    + "<div class='spread'><button class='btn ghost' id='cx'>Abbrechen</button><button class='btn primary' id='nOk'>Phase starten</button></div>", () => {
      $("cx").onclick = closeSheet;
      $("nOk").onclick = async () => {
        const start = $("nStart").value; const name = $("nName").value.trim(); if (!start || !name){ toast("Name und Start angeben."); return; }
        const nid = "P-" + pad(Math.max(0, ...phases().map(p => num(String(p.id).replace(/\D/g,"")))) + 1);
        const np = { id: nid, name, start, ende: "", fokus: $("nFokus").value.trim(), coaching_notizen: $("nNot").value.trim(), coaching_link: $("nLink").value.trim(), status: "aktiv" };
        closeSheet();
        const ok = await guarded("Phase anlegen fehlgeschlagen", async () => {
          const old = phases().filter(p => p.status === "aktiv");
          for (const p of old){ p.status = "abgeschlossen"; if (!p.ende || p.ende >= start) p.ende = addDaysIso(start, -1); await updateRow("Phasen", p); }
          S.D.Phasen.push(np); await appendRow("Phasen", np);
          for (const h of goalsOf(prev.id)){
            const nh = { id: rid("H-",6), phase_id: nid, name: h.name, farbe: h.farbe, reihenfolge: h.reihenfolge }; S.D.Hauptziele.push(nh); await appendRow("Hauptziele", nh);
            for (const z of h.subs){ const nz = { id: rid("Z-",6), phase_id: nid, hauptziel_id: nh.id, bezeichnung: z.bezeichnung, messgroesse: z.messgroesse, zielwert: z.zielwert, filter_ebene: z.filter_ebene, filter_werte: z.filter_werte, reihenfolge: z.reihenfolge }; S.D.Ziele.push(nz); await appendRow("Ziele", nz); }
          }
        });
        if (ok){ S.phaseSel = nid; toast("Phase „" + name + "“ gestartet"); render(); openExport(prev); }
      };
    });
}

/* ---------- Vorlagen ---------- */
function renderVorlagen(v){
  const vs = S.D.Vorlagen || []; const cats = [...new Set(vs.map(x => typInfo(x.typ).kategorie))];
  let h = "<section class='spread'><h2>Vorlagen</h2><div class='row'><a class='btn' href='" + SHEET_URL + "' target='_blank' rel='noopener'>Sheet öffnen ↗</a><button class='btn primary' id='vNew'>+ Vorlage</button></div></section>";
  h += cats.map(k => "<section><div class='flabel' style='margin:6px 0'>" + esc(k) + "</div><div class='vlist'>" + vs.filter(x => typInfo(x.typ).kategorie === k).map(x => "<button class='vbtn' data-ved='" + esc(x.id) + "' style='--cc:" + typColor(x.typ) + ";" + (x.aktiv === "nein" ? "opacity:.5" : "") + "'><div style='flex:1;min-width:0'><b>" + esc(x.name) + "</b> <span class='small muted num'>" + esc(x.typ) + (x.dauer_standard_min ? " · " + x.dauer_standard_min + " min" : "") + "</span><small>" + esc(x.kurzbeschreibung) + "</small></div></button>").join("") + "</div></section>").join("");
  v.innerHTML = h;
  v.querySelectorAll("[data-ved]").forEach(b => b.onclick = () => editVorlage(vs.find(x => x.id === b.dataset.ved)));
  $("vNew").onclick = () => editVorlage(null);
}
function editVorlage(x){
  const isNew = !x; x = x || { id: rid("V-",5), name:"", typ:"GA1", dauer_standard_min:"", kurzbeschreibung:"", anleitung:"", anleitung_link:"", aktualisiert_am: today(), aktiv:"ja" };
  openSheet("<h2>" + (isNew ? "Neue Vorlage" : esc(x.name)) + "</h2><div class='g2'><div class='field'><label for='vName'>Name</label><input id='vName' value='" + esc(x.name) + "'></div><div class='field'><label for='vTyp'>Typ</label><select id='vTyp'>" + typOptions(x.typ) + "</select></div></div>"
    + "<div class='g2'><div class='field'><label for='vDauer'>Standarddauer [min]</label><input id='vDauer' type='number' min='0' inputmode='numeric' value='" + esc(x.dauer_standard_min) + "'></div><div class='field'><span class='flabel'>Aktiv</span>" + segHTML("vAkt", [["ja","Ja"],["nein","Nein"]], x.aktiv || "ja") + "</div></div>"
    + "<div class='field'><label for='vKurz'>Kurzbeschreibung</label><input id='vKurz' value='" + esc(x.kurzbeschreibung) + "'></div>"
    + "<div class='field'><label for='vAnl'>Anleitung (mit Michi festgelegt; Zeilen mit „- “ werden Aufzählungen)</label><textarea id='vAnl' style='min-height:160px'>" + esc(x.anleitung) + "</textarea></div>"
    + "<div class='field'><label for='vLink'>Link</label><input id='vLink' inputmode='url' value='" + esc(x.anleitung_link) + "'></div>"
    + "<div class='spread'><button class='btn ghost' id='cx'>Abbrechen</button><button class='btn primary' id='vOk'>Speichern</button></div>", sh => {
      wireSegs(sh); $("cx").onclick = closeSheet;
      $("vOk").onclick = async () => {
        Object.assign(x, { name: $("vName").value.trim() || "Vorlage", typ: $("vTyp").value, dauer_standard_min: $("vDauer").value === "" ? "" : Number($("vDauer").value), kurzbeschreibung: $("vKurz").value.trim(), anleitung: $("vAnl").value, anleitung_link: $("vLink").value.trim(), aktiv: segVal("vAkt"), aktualisiert_am: today() });
        closeSheet();
        if (isNew){ S.D.Vorlagen.push(x); if (await guarded("Speichern fehlgeschlagen", () => appendRow("Vorlagen", x))) toast("Vorlage angelegt"); }
        else if (await guarded("Speichern fehlgeschlagen", () => updateRow("Vorlagen", x))) toast("Vorlage gespeichert");
      };
    });
}

/* ---------- boot ---------- */
const h0 = location.hash.slice(1); if (["woche","kalender","verlauf","leistung","ziele","vorlagen"].includes(h0)) S.view = h0;
render();
(async () => {
  const c = window.claude;
  const [mcp, sample, dl] = await Promise.all([c?.use?.("mcp").catch(() => null), c?.use?.("sample").catch(() => null), c?.use?.("downloads").catch(() => null)]);
  S.mcp = mcp || null; S.sample = sample || null; S.dl = dl || null;
  if (!S.mcp){ $("view").innerHTML = "<div class='panel'><b>Keine Verbindung zu Google.</b> Öffne das Dashboard in claude.ai und erlaube den Zugriff auf Google Sheets und Google Calendar. Die Daten liegen in <a href='" + SHEET_URL + "' target='_blank' rel='noopener'>Trainingsplan 2.0</a>.</div>"; return; }
  loadAll(false);
})();
})();
</script>
